<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Painel do Carro — Operação 99</title>
<meta name="description" content="Contabilidade da operação de motorista de aplicativo: km, ganhos e gastos do carro." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #14161A;
  --card: #1E2126;
  --card-alt: #14161A;
  --border: #2A2E35;
  --text: #ECEAE4;
  --muted: #8B8F98;
  --amber: #E8B430;
  --green: #3FA796;
  --red: #E85D5D;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: 'IBM Plex Mono', monospace; }
.display { font-family: 'Space Grotesk', sans-serif; }

#app { min-height: 100vh; }

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 96px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.header .brand { display: flex; align-items: center; gap: 10px; }
.header .logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--amber);
  display: flex; align-items: center; justify-content: center;
  color: var(--bg);
}
.header .title { font-size: 17px; font-weight: 600; line-height: 1; }
.header .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
.header .saving { font-size: 11px; color: var(--green); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}
.card.center { display: flex; flex-direction: column; align-items: center; }

.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 8px;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.mini-box {
  background: var(--card-alt);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.mini-box .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.mini-box .value { font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-top: 4px; }

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row .label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.stat-row .value { font-family: 'IBM Plex Mono', monospace; }

.big-stat { font-family: 'IBM Plex Mono', monospace; font-size: 22px; }

.field { margin-bottom: 14px; }
.field label {
  font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
}
.field input {
  width: 100%;
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  outline: none;
}
.field input:focus { border-color: var(--amber); }

.btn-primary {
  width: 100%;
  background: var(--amber);
  color: var(--bg);
  font-weight: 600;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 6px;
}
.btn-primary:hover { opacity: 0.9; }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
}
.btn-ghost:hover { border-color: var(--amber); color: var(--amber); }

.btn-danger { color: var(--red); border-color: var(--border); }
.btn-danger:hover { border-color: var(--red); color: var(--red); }

.hist-item { margin-bottom: 12px; }
.hist-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.hist-date { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); }
.hist-actions { display: flex; align-items: center; gap: 12px; }
.hist-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.hist-detail span b { color: var(--text); font-weight: 500; }

.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; display: flex; }
.icon-btn:hover { color: var(--red); }

.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

.nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1A1D22;
  border-top: 1px solid var(--border);
}
.nav-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
}
.nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 0;
  cursor: pointer;
}
.nav button.active { color: var(--amber); }
.nav button .nav-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 14px;
}

.footnote { font-size: 11px; color: var(--muted); margin-top: 6px; }

.backup-row { display: flex; gap: 10px; margin-top: 8px; }

.loading {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}

svg.icon { display: inline-block; vertical-align: middle; }

@media (max-width: 380px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .big-stat { font-size: 18px; }
}

</style>

    return raw ? { ...defaultSettings, ...JSON.parse(raw) } : { ...defaultSettings };
  } catch {
    return { ...defaultSettings };
  }
}
function saveSettingsToStorage(s) {
  localStorage.setItem(SKEY, JSON.stringify(s));
}
function loadEntries() {
  try {
    const raw = localStorage.getItem(EKEY);
    if (raw === null) {
      // primeira vez que o site abre neste navegador: carrega o histórico real importado da 99
      saveEntriesToStorage(SEED_ENTRIES);
      return [...SEED_ENTRIES];
    }
    return JSON.parse(raw);
  } catch {
    return [];
  }
}
function saveEntriesToStorage(list) {
  localStorage.setItem(EKEY, JSON.stringify(list));
}

// ---------- helpers ----------
const fmtR = (n) =>
  (n < 0 ? "-R$ " : "R$ ") + Math.abs(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtKm = (n) => (n || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " km";
const todayISO = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function addMonthsISO(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d.toISOString().slice(0, 10);
}

// conta quantas parcelas mensais (a partir de dataInicio) já venceram até "ate", limitado a max
function parcelasVencidas(dataInicio, ate, max = Infinity) {
  if (!dataInicio) return 0;
  let count = 0;
  while (count < max) {
    const dataParcela = addMonthsISO(dataInicio, count);
    if (dataParcela > ate) break;
    count++;
  }
  return count;
}

function financStatus(settings, ate = todayISO()) {
  const { financDataInicio, financValorParcela, financNumParcelas, financEntrada } = settings;
  const parcelasPagas = parcelasVencidas(financDataInicio, ate, financNumParcelas);
  const totalPago = (financEntrada || 0) + parcelasPagas * (financValorParcela || 0);
  const quitado = parcelasPagas >= financNumParcelas;
  const dataUltimaParcela = financNumParcelas > 0 ? addMonthsISO(financDataInicio, financNumParcelas - 1) : null;
  const ativoHoje = !quitado && ate >= financDataInicio && ate <= dataUltimaParcela;
  return { parcelasPagas, totalPago, quitado, dataUltimaParcela, ativoHoje };
}

function seguroStatus(settings, ate = todayISO()) {
  const { seguroDataInicio, seguroValor } = settings;
  const parcelasPagas = parcelasVencidas(seguroDataInicio, ate, Infinity);
  const totalPago = parcelasPagas * (seguroValor || 0);
  return { parcelasPagas, totalPago };
}

function custoFixoDoDia(dateStr, settings) {
  const financ = financStatus(settings, dateStr);
  const custoFinanciamento = financ.ativoHoje ? (settings.financValorParcela || 0) / 30 : 0;
  const custoSeguro = settings.seguroDataInicio && dateStr >= settings.seguroDataInicio ? (settings.seguroValor || 0) / 30 : 0;
  return custoFinanciamento + custoSeguro;
}

function metaMensalStatus(entries, settings, hoje = todayISO()) {
  const anoMes = hoje.slice(0, 7);
  const ganhoMes = entries.filter((e) => e.date.startsWith(anoMes)).reduce((a, e) => a + (Number(e.ganho99) || 0), 0);
  const [ano, mes] = hoje.split("-").map(Number);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const diaAtual = Number(hoje.slice(8, 10));
  const diasRestantes = Math.max(diasNoMes - diaAtual + 1, 0);
  const metaMensal = settings.metaMensal || 0;
  const falta = Math.max(0, metaMensal - ganhoMes);
  const necessarioPorDia = diasRestantes > 0 ? falta / diasRestantes : falta;
  const pct = metaMensal > 0 ? ganhoMes / metaMensal : 0;
  const batida = ganhoMes >= metaMensal && metaMensal > 0;
  return { ganhoMes, metaMensal, falta, diasRestantes, necessarioPorDia, pct, diasNoMes, diaAtual, batida };
}

// ---------- cálculos ----------
function computeTotals(entries, settings) {
  const sum = (k) => entries.reduce((a, e) => a + (Number(e[k]) || 0), 0);
  const ganho99 = sum("ganho99");
  const ganhoParticular = sum("ganhoParticular");
  const gastoCombustivel = sum("gastoCombustivel");
  const gastoOutros = sum("gastoOutros");
  const km = sum("km");
  const horas = sum("horas");
  const ganhoTotal = ganho99 + ganhoParticular;
  const gastoVariavel = gastoCombustivel + gastoOutros;
  const financ = financStatus(settings);
  const seguro = seguroStatus(settings);
  const custoFixoAcumulado = financ.totalPago + seguro.totalPago;
  const gastoTotal = gastoVariavel + custoFixoAcumulado;
  const lucroApp = ganho99 - gastoTotal; // saldo 99 x carro, acumulado (já com financiamento + seguro)
  const lucroTotal = ganhoTotal - gastoTotal; // lucro total acumulado (com particular)
  return { ganho99, ganhoParticular, gastoCombustivel, gastoOutros, gastoVariavel, custoFixoAcumulado, financ, seguro, km, horas, ganhoTotal, gastoTotal, lucroApp, lucroTotal };
}

function computeHoje(entries, settings) {
  const todays = entries.filter((e) => e.date === todayISO());
  const sum = (k) => todays.reduce((a, e) => a + (Number(e[k]) || 0), 0);
  const ganho99 = sum("ganho99");
  const ganhoParticular = sum("ganhoParticular");
  const ganhoTotal = ganho99 + ganhoParticular;
  const gastoVariavel = sum("gastoCombustivel") + sum("gastoOutros");
  const financ = financStatus(settings);
  const custoFinanciamentoHoje = financ.ativoHoje ? (settings.financValorParcela || 0) / 30 : 0;
  const custoSeguroHoje = (settings.seguroValor || 0) / 30;
  const custoFixoHoje = custoFinanciamentoHoje + custoSeguroHoje;
  const gastoTotal = gastoVariavel + custoFixoHoje;
  const saldo99 = ganho99 - gastoTotal;
  const lucroTotal = ganhoTotal - gastoTotal;
  return { ganho99, ganhoParticular, ganhoTotal, gastoVariavel, custoFixoHoje, custoFinanciamentoHoje, custoSeguroHoje, gastoTotal, saldo99, lucroTotal, horas: sum("horas") };
}

function chartData(entries, settings) {
  const map = {};
  entries.forEach((e) => {
    if (!map[e.date]) map[e.date] = { date: e.date, ganho: 0, gasto: 0 };
    map[e.date].ganho += (Number(e.ganho99) || 0) + (Number(e.ganhoParticular) || 0);
    map[e.date].gasto += (Number(e.gastoCombustivel) || 0) + (Number(e.gastoOutros) || 0) + custoFixoDoDia(e.date, settings);
  });
  return Object.values(map)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-14)
    .map((d) => ({ ...d, saldo: d.ganho - d.gasto, label: d.date.slice(5) }));
}

// ---------- gauge svg (elemento de assinatura) ----------
function gaugeSVG(pct, label, sub, tone) {
  const clamped = Math.max(0, Math.min(1, pct || 0));
  const angle = clamped * 180;
  const cx = 100, cy = 100, r = 78;
  const toRad = (a) => ((a - 180) * Math.PI) / 180;
  const x = cx + r * Math.cos(toRad(angle));
  const y = cy + r * Math.sin(toRad(angle));
  const color = tone === "neg" ? "#E85D5D" : tone === "warn" ? "#E8B430" : "#3FA796";
  return `
    <svg width="200" height="118" viewBox="0 0 200 118">
      <path d="M 22 100 A 78 78 0 0 1 178 100" fill="none" stroke="#2A2E35" stroke-width="14" stroke-linecap="round"/>
      <path d="M 22 100 A 78 78 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="3" fill="#8B8F98"/>
    </svg>
    <div style="margin-top:-24px;text-align:center;">
      <div class="mono" style="font-size:22px;color:${color};">${esc(label)}</div>
      <div class="eyebrow" style="margin-top:2px;">${esc(sub)}</div>
    </div>
  `;
}

// ---------- gráficos svg simples (sem dependência) ----------
function lineChartSVG(data, width = 600, height = 180) {
  const pad = 28;
  if (!data.length) return `<div class="empty">Sem lançamentos ainda pra mostrar no gráfico.</div>`;
  const allVals = data.flatMap((d) => [d.ganho, d.gasto]);
  const max = Math.max(...allVals, 10) * 1.15;
  const stepX = data.length > 1 ? (width - 2 * pad) / (data.length - 1) : 0;
  const x = (i) => pad + i * stepX;
  const y = (v) => height - pad - (v / max) * (height - 2 * pad);
  const line = (key) => data.map((d, i) => `${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(" ");
  const labels = data
    .map((d, i) => `<text x="${x(i).toFixed(1)}" y="${height - 6}" font-size="9" fill="#8B8F98" text-anchor="middle">${esc(d.label)}</text>`)
    .join("");
  return `
    <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
      <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#2A2E35"/>
      <polyline points="${line("ganho")}" fill="none" stroke="#3FA796" stroke-width="2"/>
      <polyline points="${line("gasto")}" fill="none" stroke="#E85D5D" stroke-width="2"/>
      ${labels}
    </svg>
    <div style="display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:6px;">
      <span><span style="color:#3FA796;">●</span> Ganho</span>
      <span><span style="color:#E85D5D;">●</span> Gasto</span>
    </div>
  `;
}

function barChartSVG(data, key, width = 600, height = 160) {
  const pad = 24;
  if (!data.length) return `<div class="empty">Sem lançamentos ainda pra mostrar no gráfico.</div>`;
  const vals = data.map((d) => d[key]);
  const maxAbs = Math.max(...vals.map(Math.abs), 10) * 1.15;
  const zeroY = height / 2;
  const scale = (height / 2 - pad / 2) / maxAbs;
  const bw = ((width - 2 * pad) / data.length) * 0.55;
  const gap = (width - 2 * pad) / data.length;
  const bars = data
    .map((d, i) => {
      const v = d[key];
      const barH = Math.abs(v) * scale;
      const bx = pad + i * gap + (gap - bw) / 2;
      const by = v >= 0 ? zeroY - barH : zeroY;
      const color = v >= 0 ? "#E8B430" : "#E85D5D";
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(barH, 1).toFixed(1)}" rx="2" fill="${color}"/>`;
    })
    .join("");
  const labels = data
    .map((d, i) => {
      const bx = pad + i * gap + gap / 2;
      return `<text x="${bx.toFixed(1)}" y="${height - 4}" font-size="9" fill="#8B8F98" text-anchor="middle">${esc(d.label)}</text>`;
    })
    .join("");
  return `
    <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
      <line x1="${pad}" y1="${zeroY}" x2="${width - pad}" y2="${zeroY}" stroke="#2A2E35"/>
      ${bars}
      ${labels}
    </svg>
  `;
}

      <div class="stat-row"><span class="label">${icon("car")} Km rodado lançado</span><span class="value">${fmtKm(totals.km)}</span></div>
      <div class="stat-row"><span class="label">${icon("gauge")} Km total desde a compra</span><span class="value">${fmtKm(kmTotalDesdeCompra)}</span></div>
      <div class="stat-row"><span class="label">${icon("fuel")} R$ ganho por km (99)</span><span class="value">${fmtR(rsPorKm)}</span></div>
      <div class="stat-row"><span class="label">${icon("wrench")} Custo por km</span><span class="value">${fmtR(custoPorKm)}</span></div>
    </div>
  `;
}

function viewConfig() {
  const s = state.settings;
  const totals = computeTotals(state.entries, s);
  const kmTotalDesdeCompra = s.kmInicial + totals.km;
  return `
    <div class="card">
      <div class="eyebrow">Metas</div>
      <p class="note">Isso é o único que você ajusta com frequência — o resto o painel calcula sozinho.</p>
      <div class="field"><label>Meta de ganho por dia — na 99 (R$)</label><input type="number" step="0.01" id="s-metaDiaria" value="${s.metaDiaria}" /></div>
      <div class="field"><label>Meta de ganho por hora (R$)</label><input type="number" step="0.01" id="s-metaHora" value="${s.metaHora}" /></div>
      <div class="field"><label>Meta de ganho por mês — na 99 (R$)</label><input type="number" step="0.01" id="s-metaMensal" value="${s.metaMensal}" /></div>
      <button class="btn-primary" id="btn-save-settings">Salvar metas</button>
    </div>

    <div class="card">
      <div class="eyebrow">Resumo automático (calculado sozinho)</div>
      <div class="stat-row"><span class="label">${icon("car")} Km atual do carro</span><span class="value">${fmtKm(kmTotalDesdeCompra)}</span></div>
      <div class="stat-row"><span class="label">${icon("wrench")} Financiamento pago (${totals.financ.parcelasPagas}/${s.financNumParcelas})</span><span class="value">${fmtR(totals.financ.totalPago)}</span></div>
      <div class="stat-row"><span class="label">${icon("clock")} Última parcela do financiamento</span><span class="value">${totals.financ.dataUltimaParcela}${totals.financ.quitado ? " (quitado)" : ""}</span></div>
      <div class="stat-row"><span class="label">${icon("wrench")} Seguro pago (${totals.seguro.parcelasPagas} meses)</span><span class="value">${fmtR(totals.seguro.totalPago)}</span></div>
      <div class="footnote">Esses valores mudam sozinhos a cada mês que passa. Não dá pra editar direto — só ajustando os parâmetros abaixo, se algo estiver errado.</div>
    </div>

    <div class="card">
      <div class="eyebrow">Parâmetros (só mexa se algo mudou ou estiver errado)</div>
      <div class="field"><label>Km do carro na hora da compra (odômetro)</label><input type="number" step="1" id="s-kmInicial" value="${s.kmInicial}" /></div>
      <div class="field"><label>Data da 1ª parcela do financiamento</label><input type="date" id="s-financDataInicio" value="${s.financDataInicio}" /></div>
      <div class="field"><label>Valor da entrada do financiamento (R$)</label><input type="number" step="0.01" id="s-financEntrada" value="${s.financEntrada}" /></div>
      <div class="field"><label>Valor de cada parcela do financiamento (R$)</label><input type="number" step="0.01" id="s-financValorParcela" value="${s.financValorParcela}" /></div>
      <div class="field"><label>Número total de parcelas do financiamento</label><input type="number" step="1" id="s-financNumParcelas" value="${s.financNumParcelas}" /></div>
      <div class="field"><label>Data em que o seguro passou a ser cobrado (dia 5)</label><input type="date" id="s-seguroDataInicio" value="${s.seguroDataInicio}" /></div>
      <div class="field"><label>Valor do seguro por mês (R$)</label><input type="number" step="0.01" id="s-seguroValor" value="${s.seguroValor}" /></div>
      <button class="btn-primary" id="btn-save-params">Salvar parâmetros</button>
    </div>

    <div class="card">
      <div class="eyebrow">Backup dos dados</div>
      <p class="note">Os dados ficam salvos só neste navegador/aparelho. Exporte um arquivo pra guardar ou levar pra outro aparelho, e importe quando precisar.</p>
      <div class="backup-row">
        <button class="btn-ghost" id="btn-export">Exportar dados (.json)</button>
        <button class="btn-ghost" id="btn-import-trigger">Importar dados</button>
      </div>
      <input type="file" id="file-import" accept="application/json" style="display:none" />
    </div>
    <div class="card">
      <div class="eyebrow">Zona de risco</div>
      <button class="btn-ghost btn-danger" id="btn-reset">Apagar todos os lançamentos e configurações</button>
    </div>
  `;
}

// ---------- render + eventos ----------
const VIEWS = {
  inicio: viewInicio,
  lancar: viewLancar,
  historico: viewHistorico,
  analise: viewAnalise,
  config: viewConfig,
};

const NAV = [
  { id: "inicio", label: "Início", icon: "home" },
  { id: "lancar", label: "Lançar dia", icon: "plus" },
  { id: "historico", label: "Histórico", icon: "bar" },
  { id: "analise", label: "Análise", icon: "trend" },
  { id: "config", label: "Config", icon: "sliders" },
];

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <div class="logo">${icon("car", 18)}</div>
          <div>
            <div class="title display">Painel do Carro</div>
            <div class="subtitle">Operação 99 &amp; particular</div>
          </div>
        </div>
        <span class="saving">${esc(state.savingMsg)}</span>
      </div>
      <div id="view-container">${VIEWS[state.view]()}</div>
    </div>
    <div class="nav">
      <div class="nav-inner">
        ${NAV.map(
          (n) => `
          <button data-nav="${n.id}" class="${state.view === n.id ? "active" : ""}">
            ${icon(n.icon, 18)}
            <span class="nav-label">${n.label}</span>
          </button>
        `
        ).join("")}
      </div>
    </div>
  `;
  attachEvents();
}

function attachEvents() {
  document.querySelectorAll("[data-nav]").forEach((btn) => {
    btn.addEventListener("click", () => setView(btn.getAttribute("data-nav")));
  });

  if (state.view === "lancar") {
    const btn = document.getElementById("btn-save-entry");
    btn.addEventListener("click", () => {
      const val = (id) => Number(document.getElementById(id).value) || 0;
      const entry = {
        id: Date.now().toString(),
        date: document.getElementById("f-date").value || todayISO(),
        km: val("f-km"),
        ganho99: val("f-ganho99"),
        ganhoParticular: val("f-ganhoParticular"),
        gastoCombustivel: val("f-gastoCombustivel"),
        gastoOutros: val("f-gastoOutros"),
        horas: val("f-horas"),
      };
      persistEntries([...state.entries, entry]);
      setView("inicio");
      flashSaved("Lançamento salvo");
    });
  }

  if (state.view === "historico") {
    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del");
        persistEntries(state.entries.filter((e) => e.id !== id));
        render();
      });
    });
  }

  if (state.view === "config") {
    document.getElementById("btn-save-settings").addEventListener("click", () => {
      const val = (id) => Number(document.getElementById(id).value) || 0;
      const next = {
        ...state.settings,
        metaDiaria: val("s-metaDiaria"),
        metaHora: val("s-metaHora"),
        metaMensal: val("s-metaMensal"),
      };
      persistSettings(next);
      flashSaved("Metas salvas");
    });

    document.getElementById("btn-save-params").addEventListener("click", () => {
      const val = (id) => Number(document.getElementById(id).value) || 0;
      const date = (id) => document.getElementById(id).value;
      const next = {
        ...state.settings,
        kmInicial: val("s-kmInicial"),
        financDataInicio: date("s-financDataInicio"),
        financEntrada: val("s-financEntrada"),
        financValorParcela: val("s-financValorParcela"),
        financNumParcelas: val("s-financNumParcelas"),
        seguroDataInicio: date("s-seguroDataInicio"),
        seguroValor: val("s-seguroValor"),
      };
      persistSettings(next);
      render();
      flashSaved("Parâmetros salvos");
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const payload = JSON.stringify({ settings: state.settings, entries: state.entries }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `painel99-backup-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    const fileInput = document.getElementById("file-import");
    document.getElementById("btn-import-trigger").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed.settings) persistSettings({ ...defaultSettings, ...parsed.settings });
          if (Array.isArray(parsed.entries)) persistEntries(parsed.entries);
          render();
          flashSaved("Dados importados");
        } catch {
          alert("Arquivo inválido. Confira se é um backup exportado por este painel.");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("Isso vai apagar todos os lançamentos e configurações deste navegador. Tem certeza?")) {
        localStorage.setItem(EKEY, JSON.stringify([]));
        localStorage.removeItem(SKEY);
        state.settings = { ...defaultSettings };
        state.entries = [];
        setView("inicio");
      }
    });
  }
}

init();

  </script>
</body>
</html>
