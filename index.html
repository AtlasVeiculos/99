<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Painel do Carro — Atlas Logística</title>
<meta name="description" content="Contabilidade da operação de motorista — Atlas Logística: km, ganhos e gastos do carro." />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #14161A;
  --card: #1E2126;
  --card-alt: #14161A;
  --border: #2A2E35;
  --text: #ECEAE4;
  --muted: #8B8F98;
  --amber: #E8B430;
  --green: #3FA796;
  --red: #E85D5D;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: 'IBM Plex Mono', monospace; }
.display { font-family: 'Space Grotesk', sans-serif; }

#app { min-height: 100vh; }

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 96px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.header .brand { display: flex; align-items: center; gap: 10px; }
.header .logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--amber);
  display: flex; align-items: center; justify-content: center;
  color: var(--bg);
}
.header .title { font-size: 17px; font-weight: 600; line-height: 1; }
.header .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
.header .saving { font-size: 11px; color: var(--green); }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.sync-badge {
  font-size: 10px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.sync-badge svg { width: 11px; height: 11px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}
.card.center { display: flex; flex-direction: column; align-items: center; }

.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 8px;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.mini-box {
  background: var(--card-alt);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.mini-box .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.mini-box .value { font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-top: 4px; }

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row .label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.stat-row .value { font-family: 'IBM Plex Mono', monospace; }

.big-stat { font-family: 'IBM Plex Mono', monospace; font-size: 22px; }

.field { margin-bottom: 14px; }
.field label {
  font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
}
.field input {
  width: 100%;
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  outline: none;
}
.field input:focus { border-color: var(--amber); }

.btn-primary {
  width: 100%;
  background: var(--amber);
  color: var(--bg);
  font-weight: 600;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 6px;
}
.btn-primary:hover { opacity: 0.9; }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
}
.btn-ghost:hover { border-color: var(--amber); color: var(--amber); }

.btn-danger { color: var(--red); border-color: var(--border); }
.btn-danger:hover { border-color: var(--red); color: var(--red); }

.filter-select {
  width: 100%;
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.filter-select:focus { border-color: var(--amber); }

.hist-item { margin-bottom: 12px; }
.hist-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.hist-date { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); }
.hist-actions { display: flex; align-items: center; gap: 12px; }
.hist-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.hist-detail span b { color: var(--text); font-weight: 500; }

.icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; display: flex; }
.icon-btn:hover { color: var(--red); }

.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

.nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1A1D22;
  border-top: 1px solid var(--border);
}
.nav-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
}
.nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 0;
  cursor: pointer;
}
.nav button.active { color: var(--amber); }
.nav button .nav-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 14px;
}

.footnote { font-size: 11px; color: var(--muted); margin-top: 6px; }

.backup-row { display: flex; gap: 10px; margin-top: 8px; }

.segmented {
  display: flex;
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
  margin-bottom: 14px;
}
.segmented button {
  flex: 1;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 12px;
  padding: 7px 4px;
  border-radius: 7px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.segmented button.active { background: var(--amber); color: var(--bg); font-weight: 600; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
}
.switch-row .switch-label { font-size: 13px; }
.switch-row .switch-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.switch {
  position: relative;
  width: 42px;
  height: 24px;
  flex-shrink: 0;
  border: none;
  border-radius: 12px;
  background: var(--border);
  cursor: pointer;
  transition: background 0.15s ease;
}
.switch.on { background: var(--amber); }
.switch::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--text);
  transition: transform 0.15s ease;
}
.switch.on::after { transform: translateX(18px); }

.chart-tip { font-size: 11px; color: var(--muted); margin-top: 4px; }

.loading {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}

svg.icon { display: inline-block; vertical-align: middle; }

@media (max-width: 380px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .big-stat { font-size: 18px; }
}

</style>
</head>

// ---------- storage ----------
// Quando o painel roda dentro do Claude (como artifact), window.storage existe e
// sincroniza os dados automaticamente entre qualquer aparelho logado na mesma conta.
// Quando roda como página solta num navegador comum, window.storage não existe e o
// painel cai de volta pro localStorage (dados presos a esse navegador/aparelho).
// Em ambos os casos, sempre mantemos uma cópia no localStorage como rede de segurança.
const SKEY = "painelAtlas_settings";
const EKEY = "painelAtlas_entries";
const MKEY = "painelAtlas_manutencoes";
const LKEY = "painelAtlas_lembretes";

// chaves da versão anterior do painel (antes de virar "Atlas Logística"), usadas só
// pra migrar dados antigos automaticamente na primeira abertura desta versão.
const OLD_SKEY = "painel99_settings";
const OLD_EKEY = "painel99_entries";
const OLD_MKEY = "painel99_manutencoes";
const OLD_LKEY = "painel99_lembretes";

function hasCloudSync() {
  return typeof window !== "undefined" && !!window.storage && typeof window.storage.get === "function";
}

async function cloudGet(key) {
  try {
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  } catch {
    return null;
  }
}
async function cloudSet(key, value) {
  try {
    await window.storage.set(key, value, false);
    return true;
  } catch {
    return false;
  }
}
async function cloudRemove(key) {
  try {
    await window.storage.delete(key, false);
  } catch {
    /* silencioso: se falhar, a cópia local já foi limpa de qualquer forma */
  }
}

// lê da nuvem quando disponível; se a nuvem estiver vazia mas existir cópia local
// (ex: dado salvo antes de a sincronização existir), sobe a cópia local pra nuvem.
async function storageGet(key) {
  if (hasCloudSync()) {
    const cloudValue = await cloudGet(key);
    if (cloudValue !== null) return cloudValue;
    const local = localStorage.getItem(key);
    if (local !== null) {
      cloudSet(key, local);
      return local;
    }
    return null;
  }
  return localStorage.getItem(key);
}

// grava sempre uma cópia local (imediata, nunca falha) e also manda pra nuvem em
// segundo plano quando disponível, sem travar a interface esperando a rede.
function storageSet(key, value) {
  localStorage.setItem(key, value);
  if (hasCloudSync()) {
    cloudSet(key, value).then((ok) => {
      state.cloudLastSyncOk = ok;
      updateSyncBadge();
    });
  }
}
function storageRemove(key) {
  localStorage.removeItem(key);
  if (hasCloudSync()) cloudRemove(key);
}

// migra dados salvos pela versão anterior (nome "99", só no localStorage) pra cá.
// Roda 1x, silenciosamente, e nunca sobrescreve dado que já exista na versão nova.
function migrateGanho99ToAtlas(entry) {
  if (entry && entry.ganho99 !== undefined && entry.ganhoAtlas === undefined) {
    const { ganho99, ...rest } = entry;
    return { ...rest, ganhoAtlas: Number(ganho99) || 0 };
  }
  return entry;
}
async function migrateOldStorage() {
  const pairs = [
    [OLD_SKEY, SKEY, (raw) => raw],
    [OLD_EKEY, EKEY, (raw) => JSON.stringify(JSON.parse(raw).map(migrateGanho99ToAtlas))],
    [OLD_MKEY, MKEY, (raw) => raw],
    [OLD_LKEY, LKEY, (raw) => raw],
  ];
  for (const [oldKey, newKey, transform] of pairs) {
    try {
      const alreadyNew = await storageGet(newKey);
      if (alreadyNew !== null) continue;
      const oldRaw = localStorage.getItem(oldKey);
      if (oldRaw === null) continue;
      storageSet(newKey, transform(oldRaw));
    } catch {
      /* migração de uma chave falhou: não trava o resto do app */
    }
  }
}

async function loadSettings() {
  try {
    const raw = await storageGet(SKEY);
    return raw ? sanitizeSettings({ ...defaultSettings, ...JSON.parse(raw) }) : { ...defaultSettings };
  } catch {
    return { ...defaultSettings };
  }
}
function saveSettingsToStorage(s) {
  storageSet(SKEY, JSON.stringify(s));
}
async function loadEntries() {
  try {
    const raw = await storageGet(EKEY);
    if (raw === null) {
      // primeira vez que o painel abre neste aparelho: carrega o histórico real importado da Atlas Logística
      saveEntriesToStorage(SEED_ENTRIES);
      return [...SEED_ENTRIES];
    }
    return JSON.parse(raw).map(migrateGanho99ToAtlas).map(sanitizeEntry).filter(Boolean);
  } catch {
    return [];
  }
}
function saveEntriesToStorage(list) {
  storageSet(EKEY, JSON.stringify(list));
}

// ---------- helpers ----------
const fmtR = (n) =>
  (n < 0 ? "-R$ " : "R$ ") + Math.abs(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtKm = (n) => (n || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " km";
const todayISO = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const isValidDateStr = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(new Date(d + "T00:00:00").getTime());
const numOr = (v, fallback = 0) => (Number.isFinite(Number(v)) ? Number(v) : fallback);

// valida e limpa um lançamento vindo de importação (JSON/CSV) ou de storage corrompido,
// pra nunca deixar um registro malformado quebrar o resto do painel.
function sanitizeEntry(e) {
  if (!e || typeof e !== "object" || !isValidDateStr(e.date)) return null;
  return {
    id: e.id ? String(e.id) : `imp-${e.date}-${Math.random().toString(36).slice(2, 8)}`,
    date: e.date,
    km: Math.max(0, numOr(e.km)),
    ganhoAtlas: Math.max(0, numOr(e.ganhoAtlas !== undefined ? e.ganhoAtlas : e.ganho99)),
    ganhoParticular: Math.max(0, numOr(e.ganhoParticular)),
    gastoCombustivel: Math.max(0, numOr(e.gastoCombustivel)),
    gastoOutros: Math.max(0, numOr(e.gastoOutros)),
    horas: Math.max(0, Math.min(24, numOr(e.horas))),
  };
}

function sanitizeManutencao(m) {
  if (!m || typeof m !== "object" || !m.tipo) return null;
  return {
    id: m.id ? String(m.id) : `imp-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    date: isValidDateStr(m.date) ? m.date : todayISO(),
    tipo: String(m.tipo).slice(0, 120),
    oficina: m.oficina ? String(m.oficina).slice(0, 120) : "",
    valor: Math.max(0, numOr(m.valor)),
    km: Math.max(0, numOr(m.km)),
  };
}

function sanitizeLembrete(l) {
  if (!l || typeof l !== "object" || !l.tipo) return null;
  return {
    id: l.id ? String(l.id) : `imp-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    tipo: String(l.tipo).slice(0, 120),
    intervaloKm: Math.max(1, numOr(l.intervaloKm, 1)),
    ultimoKm: Math.max(0, numOr(l.ultimoKm)),
  };
}

function sanitizeSettings(s) {
  if (!s || typeof s !== "object") return { ...defaultSettings };
  const out = { ...defaultSettings, ...s };
  out.kmInicial = Math.max(0, numOr(out.kmInicial));
  out.metaDiaria = Math.max(0, numOr(out.metaDiaria));
  out.metaHora = Math.max(0, numOr(out.metaHora));
  out.metaMensal = Math.max(0, numOr(out.metaMensal));
  out.metaSemanal = Math.max(0, numOr(out.metaSemanal));
  out.financValorParcela = Math.max(0, numOr(out.financValorParcela));
  out.financNumParcelas = Math.max(0, Math.round(numOr(out.financNumParcelas)));
  out.financEntrada = Math.max(0, numOr(out.financEntrada));
  out.seguroValor = Math.max(0, numOr(out.seguroValor));
  out.ipvaValorAnual = Math.max(0, numOr(out.ipvaValorAnual));
  if (out.financDataInicio && !isValidDateStr(out.financDataInicio)) out.financDataInicio = defaultSettings.financDataInicio;
  if (out.seguroDataInicio && !isValidDateStr(out.seguroDataInicio)) out.seguroDataInicio = defaultSettings.seguroDataInicio;
  if (out.ipvaDataInicio && !isValidDateStr(out.ipvaDataInicio)) out.ipvaDataInicio = "";
  return out;
}

function addMonthsISO(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d.toISOString().slice(0, 10);
}

// conta quantas parcelas mensais (a partir de dataInicio) já venceram até "ate", limitado a max
function parcelasVencidas(dataInicio, ate, max = Infinity, intervalMonths = 1) {
  if (!dataInicio) return 0;
  let count = 0;
  while (count < max) {
    const dataParcela = addMonthsISO(dataInicio, count * intervalMonths);
    if (dataParcela > ate) break;
    count++;
  }
  return count;
}

function financStatus(settings, ate = todayISO()) {
  const { financDataInicio, financValorParcela, financNumParcelas, financEntrada } = settings;
  const parcelasPagas = parcelasVencidas(financDataInicio, ate, financNumParcelas);
  const totalPago = (financEntrada || 0) + parcelasPagas * (financValorParcela || 0);
  const quitado = parcelasPagas >= financNumParcelas;
  const dataUltimaParcela = financNumParcelas > 0 ? addMonthsISO(financDataInicio, financNumParcelas - 1) : null;
  const ativoHoje = !quitado && ate >= financDataInicio && ate <= dataUltimaParcela;
  return { parcelasPagas, totalPago, quitado, dataUltimaParcela, ativoHoje };
}

function seguroStatus(settings, ate = todayISO()) {
  const { seguroDataInicio, seguroValor } = settings;
  const parcelasPagas = parcelasVencidas(seguroDataInicio, ate, Infinity);
  const totalPago = parcelasPagas * (seguroValor || 0);
  return { parcelasPagas, totalPago };
}

function ipvaStatus(settings, ate = todayISO()) {
  const { ipvaDataInicio, ipvaValorAnual } = settings;
  if (!ipvaDataInicio || !ipvaValorAnual) return { parcelasPagas: 0, totalPago: 0 };
  const parcelasPagas = parcelasVencidas(ipvaDataInicio, ate, Infinity, 12);
  const totalPago = parcelasPagas * (ipvaValorAnual || 0);
  return { parcelasPagas, totalPago };
}

function custoFixoDoDia(dateStr, settings) {
  const financ = financStatus(settings, dateStr);
  const custoFinanciamento = financ.ativoHoje ? (settings.financValorParcela || 0) / 30 : 0;
  const custoSeguro = settings.seguroDataInicio && dateStr >= settings.seguroDataInicio ? (settings.seguroValor || 0) / 30 : 0;
  const custoIpva = settings.ipvaDataInicio && settings.ipvaValorAnual && dateStr >= settings.ipvaDataInicio ? settings.ipvaValorAnual / 365 : 0;
  return custoFinanciamento + custoSeguro + custoIpva;
}

function metaMensalStatus(entries, settings, hoje = todayISO()) {
  const anoMes = hoje.slice(0, 7);
  const ganhoMes = entries.filter((e) => e.date.startsWith(anoMes)).reduce((a, e) => a + (Number(e.ganhoAtlas) || 0), 0);
  const [ano, mes] = hoje.split("-").map(Number);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const diaAtual = Number(hoje.slice(8, 10));
  const diasRestantes = Math.max(diasNoMes - diaAtual + 1, 0);
  const metaMensal = settings.metaMensal || 0;
  const falta = Math.max(0, metaMensal - ganhoMes);
  const necessarioPorDia = diasRestantes > 0 ? falta / diasRestantes : falta;
  const pct = metaMensal > 0 ? ganhoMes / metaMensal : 0;
  const batida = ganhoMes >= metaMensal && metaMensal > 0;
  return { ganhoMes, metaMensal, falta, diasRestantes, necessarioPorDia, pct, diasNoMes, diaAtual, batida };
}

function addDaysISO(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function metaSemanalStatus(entries, settings, hoje = todayISO()) {
  const inicio = addDaysISO(hoje, -6);
  const ganhoSemana = entries.filter((e) => e.date >= inicio && e.date <= hoje).reduce((a, e) => a + (Number(e.ganhoAtlas) || 0), 0);
  const metaSemanal = settings.metaSemanal || 0;
  const falta = Math.max(0, metaSemanal - ganhoSemana);
  const pct = metaSemanal > 0 ? ganhoSemana / metaSemanal : 0;
  const batida = ganhoSemana >= metaSemanal && metaSemanal > 0;
  return { ganhoSemana, metaSemanal, falta, pct, batida, inicio, fim: hoje };
}

function somaPeriodo(entries, settings, inicio, fim) {
  const filtrados = entries.filter((e) => e.date >= inicio && e.date <= fim);
  const ganhoAtlas = filtrados.reduce((a, e) => a + (Number(e.ganhoAtlas) || 0), 0);
  const gastoVariavel = filtrados.reduce((a, e) => a + (Number(e.gastoCombustivel) || 0) + (Number(e.gastoOutros) || 0), 0);
  const custoFixo = filtrados.reduce((a, e) => a + custoFixoDoDia(e.date, settings), 0);
  const km = filtrados.reduce((a, e) => a + (Number(e.km) || 0), 0);
  const lucro = ganhoAtlas - gastoVariavel - custoFixo;
  return { ganhoAtlas, gastoVariavel, custoFixo, km, lucro };
}

function compararPeriodos(entries, settings, hoje = todayISO()) {
  const anoMesAtual = hoje.slice(0, 7);
  const [ano, mes] = hoje.split("-").map(Number);
  const mesAnteriorDate = new Date(ano, mes - 2, 1);
  const anoMesAnterior = `${mesAnteriorDate.getFullYear()}-${String(mesAnteriorDate.getMonth() + 1).padStart(2, "0")}`;
  const mesAtual = somaPeriodo(entries, settings, `${anoMesAtual}-01`, hoje);
  const ultimoDiaMesAnterior = new Date(mesAnteriorDate.getFullYear(), mesAnteriorDate.getMonth() + 1, 0).getDate();
  const mesAnterior = somaPeriodo(entries, settings, `${anoMesAnterior}-01`, `${anoMesAnterior}-${String(ultimoDiaMesAnterior).padStart(2, "0")}`);

  const semanaAtualInicio = addDaysISO(hoje, -6);
  const semanaAnteriorFim = addDaysISO(hoje, -7);
  const semanaAnteriorInicio = addDaysISO(hoje, -13);
  const semanaAtual = somaPeriodo(entries, settings, semanaAtualInicio, hoje);
  const semanaAnterior = somaPeriodo(entries, settings, semanaAnteriorInicio, semanaAnteriorFim);

  return { mesAtual, mesAnterior, semanaAtual, semanaAnterior };
}

function rankingDias(entries, settings, n = 5) {
  const trabalhados = entries.filter((e) => (Number(e.ganhoAtlas) || 0) > 0 || (Number(e.km) || 0) > 0);
  const comSaldo = trabalhados.map((e) => ({
    date: e.date,
    // mesmo cálculo de saldo usado no histórico e no dia de hoje: já inclui o rateio
    // diário de financiamento/seguro/ipva, não só combustível e outros gastos.
    saldo: (Number(e.ganhoAtlas) || 0) - (Number(e.gastoCombustivel) || 0) - (Number(e.gastoOutros) || 0) - custoFixoDoDia(e.date, settings),
  }));
  const melhores = [...comSaldo].sort((a, b) => b.saldo - a.saldo).slice(0, n);
  const piores = [...comSaldo].sort((a, b) => a.saldo - b.saldo).slice(0, n);
  return { melhores, piores };
}

function projecaoBreakeven(entries, settings, totals, hoje = todayISO()) {
  if (totals.lucroApp >= 0) return { atingido: true, valor: totals.lucroApp };
  const inicio30 = addDaysISO(hoje, -29);
  const p = somaPeriodo(entries, settings, inicio30, hoje);
  const mediaDiaria = p.lucro / 30;
  if (mediaDiaria <= 0) return { atingido: false, projetavel: false };
  const diasNecessarios = Math.ceil(Math.abs(totals.lucroApp) / mediaDiaria);
  const dataProjetada = addDaysISO(hoje, diasNecessarios);
  return { atingido: false, projetavel: true, diasNecessarios, dataProjetada, mediaDiaria };
}

function lembretesStatus(lembretes, kmAtual) {
  return lembretes.map((l) => {
    const proximaTroca = (Number(l.ultimoKm) || 0) + (Number(l.intervaloKm) || 0);
    const atrasado = kmAtual >= proximaTroca;
    const kmRestante = proximaTroca - kmAtual;
    return { ...l, proximaTroca, atrasado, kmRestante };
  });
}

// ---------- state ----------
let state = {
  view: "inicio",
  settings: defaultSettings,
  entries: [],
  manutencoes: [],
  lembretes: [],
  savingMsg: "",
  editingEntryId: null,
  historicoFiltroMes: "todos",
  historicoFiltroStatus: "todos",
  cloudAvailable: false,
  cloudLastSyncOk: null,
  chartPeriodo: 14, // dias mostrados nos gráficos de Análise
  notifAtivo: false,
  ready: false,
};

async function init() {
  state.cloudAvailable = hasCloudSync();
  try {
    await migrateOldStorage();
    const [settings, entries, manutencoes, lembretes] = await Promise.all([
      loadSettings(),
      loadEntries(),
      loadManutencoes(),
      loadLembretes(),
    ]);
    state.settings = settings;
    state.entries = entries;
    state.manutencoes = manutencoes;
    state.lembretes = lembretes;
    state.cloudLastSyncOk = state.cloudAvailable ? true : null;
  } catch {
    // se algo falhar no carregamento, segue com os valores padrão em vez de travar a tela
  }
  state.notifAtivo = localStorage.getItem("painelAtlas_notif") === "1" && typeof Notification !== "undefined" && Notification.permission === "granted";
  state.ready = true;
  render();
  agendarLembreteDiario();
}

function setView(v) {
  state.view = v;
  render();
}

function flashSaved(msg) {
  state.savingMsg = msg;
  render();
  setTimeout(() => {
    state.savingMsg = "";
    const el = document.querySelector(".saving");
    if (el) el.textContent = "";
  }, 2000);
}

// badge de sincronização: atualizado direto no DOM (sem re-render completo) pra não
// perder o que a pessoa estiver digitando em outro formulário na hora que a nuvem responder.
function syncBadgeContent() {
  if (!state.cloudAvailable) return `${icon("cloud", 12)} Salvo só neste aparelho`;
  if (state.cloudLastSyncOk === false) return `${icon("alert", 12)} Falha ao sincronizar — dado salvo localmente`;
  if (state.cloudLastSyncOk === null) return `${icon("cloud", 12)} Sincronizando…`;
  return `${icon("cloud", 12)} Sincronizado entre aparelhos`;
}
function updateSyncBadge() {
  const el = document.getElementById("sync-badge");
  if (el) el.innerHTML = syncBadgeContent();
}

function persistSettings(next) {
  state.settings = next;
  if (state.cloudAvailable) {
    state.cloudLastSyncOk = null;
    updateSyncBadge();
  }
  saveSettingsToStorage(next);
}
function persistEntries(next) {

}

// dispara (no máximo 1x por dia) um lembrete pra lançar o dia, se a pessoa ativou
// a notificação em Config e ainda não lançou hoje. Só funciona com a aba aberta —
// não é um push notification de verdade, é só uma notificação do navegador local.
function agendarLembreteDiario() {
  if (!state.notifAtivo || typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const jaLancouHoje = state.entries.some((e) => e.date === todayISO());
  if (jaLancouHoje) return;
  const jaAvisouHoje = localStorage.getItem("painelAtlas_ultimoAviso") === todayISO();
  if (jaAvisouHoje) return;
  try {
    new Notification("Painel do Carro — Atlas Logística", {
      body: "Você ainda não lançou o dia de hoje. Toca aqui pra registrar.",
    });
    localStorage.setItem("painelAtlas_ultimoAviso", todayISO());
  } catch {
    /* navegador pode bloquear silenciosamente, sem problema */
  }
}

// ---------- cálculos ----------
function computeTotals(entries, settings) {
  const sum = (k) => entries.reduce((a, e) => a + (Number(e[k]) || 0), 0);
  const ganhoAtlas = sum("ganhoAtlas");
  const ganhoParticular = sum("ganhoParticular");
  const gastoCombustivel = sum("gastoCombustivel");
  const gastoOutros = sum("gastoOutros");
  const km = sum("km");
  const horas = sum("horas");
  const ganhoTotal = ganhoAtlas + ganhoParticular;
  const gastoVariavel = gastoCombustivel + gastoOutros;
  const financ = financStatus(settings);
  const seguro = seguroStatus(settings);
  const ipva = ipvaStatus(settings);
  const custoFixoAcumulado = financ.totalPago + seguro.totalPago + ipva.totalPago;
  const gastoTotal = gastoVariavel + custoFixoAcumulado;
  const lucroApp = ganhoAtlas - gastoTotal; // saldo Atlas Logística x carro, acumulado (já com financiamento + seguro + ipva)
  const lucroTotal = ganhoTotal - gastoTotal; // lucro total acumulado (com particular)
  return { ganhoAtlas, ganhoParticular, gastoCombustivel, gastoOutros, gastoVariavel, custoFixoAcumulado, financ, seguro, ipva, km, horas, ganhoTotal, gastoTotal, lucroApp, lucroTotal };
}

function computeHoje(entries, settings) {
  const todays = entries.filter((e) => e.date === todayISO());
  const sum = (k) => todays.reduce((a, e) => a + (Number(e[k]) || 0), 0);
  const ganhoAtlas = sum("ganhoAtlas");
  const ganhoParticular = sum("ganhoParticular");
  const ganhoTotal = ganhoAtlas + ganhoParticular;
  const gastoVariavel = sum("gastoCombustivel") + sum("gastoOutros");
  const financ = financStatus(settings);
  const custoFinanciamentoHoje = financ.ativoHoje ? (settings.financValorParcela || 0) / 30 : 0;
  const custoSeguroHoje = (settings.seguroValor || 0) / 30;
  const custoIpvaHoje = (settings.ipvaValorAnual || 0) / 365;
  const custoFixoHoje = custoFinanciamentoHoje + custoSeguroHoje + custoIpvaHoje;
  const gastoTotal = gastoVariavel + custoFixoHoje;
  const saldoAtlas = ganhoAtlas - gastoTotal;
  const lucroTotal = ganhoTotal - gastoTotal;
  return { ganhoAtlas, ganhoParticular, ganhoTotal, gastoVariavel, custoFixoHoje, custoFinanciamentoHoje, custoSeguroHoje, custoIpvaHoje, gastoTotal, saldoAtlas, lucroTotal, horas: sum("horas") };
}

function chartData(entries, settings, dias = 14) {
  const map = {};
  entries.forEach((e) => {
    if (!map[e.date]) map[e.date] = { date: e.date, ganho: 0, gasto: 0 };
    map[e.date].ganho += (Number(e.ganhoAtlas) || 0) + (Number(e.ganhoParticular) || 0);
    map[e.date].gasto += (Number(e.gastoCombustivel) || 0) + (Number(e.gastoOutros) || 0) + custoFixoDoDia(e.date, settings);
  });
  return Object.values(map)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-dias)
    .map((d) => ({ ...d, saldo: d.ganho - d.gasto, label: d.date.slice(5) }));
}

// agrega por mês (útil pra ver a tendência num histórico longo, tipo o seu de ~1 ano)
function chartDataMensal(entries, settings, meses = 12) {
  const map = {};
  entries.forEach((e) => {
    const chave = e.date.slice(0, 7);
    if (!map[chave]) map[chave] = { date: chave, ganho: 0, gasto: 0 };
    map[chave].ganho += (Number(e.ganhoAtlas) || 0) + (Number(e.ganhoParticular) || 0);
    map[chave].gasto += (Number(e.gastoCombustivel) || 0) + (Number(e.gastoOutros) || 0) + custoFixoDoDia(e.date, settings);
  });
  return Object.values(map)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-meses)
    .map((d) => ({ ...d, saldo: d.ganho - d.gasto, label: d.date.slice(2).replace("-", "/") }));
}

// ---------- gauge svg (elemento de assinatura) ----------
function gaugeSVG(pct, label, sub, tone) {
  const clamped = Math.max(0, Math.min(1, pct || 0));
  const angle = clamped * 180;
  const cx = 100, cy = 100, r = 78;
  const toRad = (a) => ((a - 180) * Math.PI) / 180;
  const x = cx + r * Math.cos(toRad(angle));
  const y = cy + r * Math.sin(toRad(angle));
  const color = tone === "neg" ? "#E85D5D" : tone === "warn" ? "#E8B430" : "#3FA796";
  return `
    <svg width="200" height="118" viewBox="0 0 200 118">
      <path d="M 22 100 A 78 78 0 0 1 178 100" fill="none" stroke="#2A2E35" stroke-width="14" stroke-linecap="round"/>
      <path d="M 22 100 A 78 78 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="3" fill="#8B8F98"/>
    </svg>
    <div style="margin-top:-24px;text-align:center;">
      <div class="mono" style="font-size:22px;color:${color};">${esc(label)}</div>
      <div class="eyebrow" style="margin-top:2px;">${esc(sub)}</div>
    </div>
  `;
}

// calcula até 4 linhas de grade "redondas" (ex: 0, 250, 500, 750) pra um valor máximo
function gridSteps(maxVal, n = 4) {
  if (maxVal <= 0) return [0];
  const raw = maxVal / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const niceRaw = raw / mag;
  const nice = niceRaw >= 5 ? 5 : niceRaw >= 2 ? 2 : 1;
  const step = nice * mag;
  const steps = [];
  for (let v = 0; v <= maxVal + step * 0.5; v += step) steps.push(Math.round(v * 100) / 100);
  return steps;
}

// ---------- gráficos svg simples (sem dependência), com grade e tooltip nativo ----------
function lineChartSVG(data, width = 620, height = 200) {
  const padL = 40, padR = 12, padT = 12, padB = 22;
  if (!data.length) return `<div class="empty">Sem lançamentos ainda pra mostrar no gráfico.</div>`;
  const allVals = data.flatMap((d) => [d.ganho, d.gasto]);
  const maxRaw = Math.max(...allVals, 10);
  const steps = gridSteps(maxRaw * 1.1);
  const max = steps[steps.length - 1] || maxRaw * 1.15;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const x = (i) => padL + i * stepX;
  const y = (v) => padT + innerH - (v / max) * innerH;
  const line = (key) => data.map((d, i) => `${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(" ");
  const skip = Math.ceil(data.length / 8); // evita labels colados quando tem muitos pontos
  const gridLines = steps
    .map(
      (v) => `
        <line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${width - padR}" y2="${y(v).toFixed(1)}" stroke="#2A2E35" stroke-dasharray="2,3"/>
        <text x="${padL - 6}" y="${(y(v) + 3).toFixed(1)}" font-size="9" fill="#8B8F98" text-anchor="end">${fmtCompact(v)}</text>
      `
    )
    .join("");
  const labels = data
    .map((d, i) =>
      i % skip === 0
        ? `<text x="${x(i).toFixed(1)}" y="${height - 4}" font-size="9" fill="#8B8F98" text-anchor="middle">${esc(d.label)}</text>`
        : ""
    )
    .join("");
  const pontos = (key, color) =>
    data
      .map(
        (d, i) =>
          `<circle cx="${x(i).toFixed(1)}" cy="${y(d[key]).toFixed(1)}" r="2.5" fill="${color}"><title>${esc(d.label)} — ${esc(key === "ganho" ? "Ganho" : "Gasto")}: ${esc(fmtR(d[key]))}</title></circle>`
      )
      .join("");
  return `
    <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <polyline points="${line("ganho")}" fill="none" stroke="#3FA796" stroke-width="2"/>
      <polyline points="${line("gasto")}" fill="none" stroke="#E85D5D" stroke-width="2"/>
      ${pontos("ganho", "#3FA796")}
      ${pontos("gasto", "#E85D5D")}
      ${labels}
    </svg>
    <div style="display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:6px;">
      <span><span style="color:#3FA796;">●</span> Ganho</span>
      <span><span style="color:#E85D5D;">●</span> Gasto</span>
    </div>
    <div class="chart-tip">Toque ou passe o mouse num ponto pra ver o valor exato.</div>
  `;
}

function fmtCompact(v) {
  if (Math.abs(v) >= 1000) return (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "k";
  return v.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
}

function barChartSVG(data, key, width = 620, height = 170) {
  const padL = 40, padR = 12, padT = 10, padB = 20;
  if (!data.length) return `<div class="empty">Sem lançamentos ainda pra mostrar no gráfico.</div>`;
  const vals = data.map((d) => d[key]);
  const maxAbs = Math.max(...vals.map(Math.abs), 10) * 1.15;
  const innerH = height - padT - padB;
  const zeroY = padT + innerH / 2;
  const scale = innerH / 2 / maxAbs;
  const innerW = width - padL - padR;
  const bw = (innerW / data.length) * 0.55;
  const gap = innerW / data.length;
  const skip = Math.ceil(data.length / 8);
  const steps = gridSteps(maxAbs);
  const gridLines = steps
    .filter((v) => v > 0)
    .flatMap((v) => [
      `<line x1="${padL}" y1="${(zeroY - v * scale).toFixed(1)}" x2="${width - padR}" y2="${(zeroY - v * scale).toFixed(1)}" stroke="#2A2E35" stroke-dasharray="2,3"/>`,
      `<text x="${padL - 6}" y="${(zeroY - v * scale + 3).toFixed(1)}" font-size="9" fill="#8B8F98" text-anchor="end">${fmtCompact(v)}</text>`,
    ])
    .join("");
  const bars = data
    .map((d, i) => {
      const v = d[key];
      const barH = Math.abs(v) * scale;
      const bx = padL + i * gap + (gap - bw) / 2;
      const by = v >= 0 ? zeroY - barH : zeroY;
      const color = v >= 0 ? "#E8B430" : "#E85D5D";
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(barH, 1).toFixed(1)}" rx="2" fill="${color}"><title>${esc(d.label)}: ${esc(fmtR(v))}</title></rect>`;
    })
    .join("");
  const labels = data
    .map((d, i) => {
      const bx = padL + i * gap + gap / 2;
      return i % skip === 0
        ? `<text x="${bx.toFixed(1)}" y="${height - 4}" font-size="9" fill="#8B8F98" text-anchor="middle">${esc(d.label)}</text>`
        : "";
    })
    .join("");
  return `
    <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <line x1="${padL}" y1="${zeroY}" x2="${width - padR}" y2="${zeroY}" stroke="#2A2E35"/>
      ${bars}
      ${labels}
    </svg>
    <div class="chart-tip">Toque ou passe o mouse numa barra pra ver o valor exato.</div>
  `;
}

function viewHistorico() {
  if (!state.entries.length) {
    return `<div class="card"><div class="empty">Nenhum lançamento ainda. Adicione o primeiro em "Lançar dia".</div></div>`;
  }
  const meses = [...new Set(state.entries.map((e) => e.date.slice(0, 7)))].sort().reverse();
  let filtrados = [...state.entries];
  if (state.historicoFiltroMes !== "todos") {
    filtrados = filtrados.filter((e) => e.date.startsWith(state.historicoFiltroMes));
  }
  const comSaldo = filtrados.map((e) => {
    const custoFixoDia = custoFixoDoDia(e.date, state.settings);
    const gasto = e.gastoCombustivel + e.gastoOutros + custoFixoDia;
    return { e, custoFixoDia, saldoAtlas: e.ganhoAtlas - gasto };
  });
  let visiveis = comSaldo;
  if (state.historicoFiltroStatus === "positivos") visiveis = comSaldo.filter((x) => x.saldoAtlas >= 0);
  if (state.historicoFiltroStatus === "negativos") visiveis = comSaldo.filter((x) => x.saldoAtlas < 0);
  visiveis.sort((a, b) => b.e.date.localeCompare(a.e.date));

  const filtros = `
    <div class="card">
      <div class="grid-2">
        <div class="field" style="margin-bottom:0;">
          <label>Mês</label>
          <select id="f-filtro-mes" class="filter-select">
            <option value="todos" ${state.historicoFiltroMes === "todos" ? "selected" : ""}>Todos</option>
            ${meses.map((m) => `<option value="${m}" ${state.historicoFiltroMes === m ? "selected" : ""}>${m}</option>`).join("")}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Status</label>
          <select id="f-filtro-status" class="filter-select">
            <option value="todos" ${state.historicoFiltroStatus === "todos" ? "selected" : ""}>Todos</option>
            <option value="positivos" ${state.historicoFiltroStatus === "positivos" ? "selected" : ""}>Positivos</option>
            <option value="negativos" ${state.historicoFiltroStatus === "negativos" ? "selected" : ""}>Negativos</option>
          </select>
        </div>
      </div>
    </div>
  `;

  if (!visiveis.length) {
    return filtros + `<div class="card"><div class="empty">Nenhum lançamento encontrado com esse filtro.</div></div>`;
  }

  const lista = visiveis
    .map(({ e, custoFixoDia, saldoAtlas }) => `
        <div class="card hist-item">
          <div class="hist-top">
            <span class="hist-date">${esc(e.date)}</span>
            <div class="hist-actions">
              <span class="mono" style="color:${saldoAtlas >= 0 ? "#3FA796" : "#E85D5D"}">${fmtR(saldoAtlas)}</span>
              <button class="icon-btn" data-edit="${e.id}">${icon("edit", 15)}</button>
              <button class="icon-btn" data-del="${e.id}">${icon("trash", 15)}</button>
            </div>
          </div>
          <div class="hist-detail">
            <span>Ganho Atlas Logística: <b>${fmtR(e.ganhoAtlas)}</b></span>
            <span>Ganho particular: <b>${fmtR(e.ganhoParticular)}</b></span>
            <span>Km rodado: <b>${fmtKm(e.km)}</b></span>
            <span>Combustível: <b>${fmtR(e.gastoCombustivel)}</b></span>
            <span>Outros gastos: <b>${fmtR(e.gastoOutros)}</b></span>
            <span>Financiamento + seguro/IPVA (dia): <b>${fmtR(custoFixoDia)}</b></span>
            <span>Horas: <b>${e.horas}h</b></span>
          </div>
        </div>
      `)
    .join("");

  return filtros + lista;
}

function viewAnalise() {
  const totals = computeTotals(state.entries, state.settings);
  const data = chartData(state.entries, state.settings, state.chartPeriodo);
  const dataMensal = chartDataMensal(state.entries, state.settings, 12);
  const kmTotalDesdeCompra = state.settings.kmInicial + totals.km;
  const rsPorKm = totals.km > 0 ? totals.ganhoAtlas / totals.km : 0;
  const custoPorKm = totals.km > 0 ? totals.gastoVariavel / totals.km : 0;
  const custoTotalPorKm = totals.km > 0 ? totals.gastoTotal / totals.km : 0;
  const cmp = compararPeriodos(state.entries, state.settings);
  const rank = rankingDias(state.entries, state.settings, 5);
  const breakeven = projecaoBreakeven(state.entries, state.settings, totals);

  const linhaComparacao = (label, atual, anterior) => {
    const dif = atual - anterior;
    const cor = dif >= 0 ? "#3FA796" : "#E85D5D";
    return `
      <div class="stat-row">
        <span class="label">${label}</span>
        <span class="value">${fmtR(atual)} <span style="color:${cor};font-size:11px;">(${dif >= 0 ? "+" : ""}${fmtR(dif)})</span></span>
      </div>`;
  };

  const periodos = [7, 14, 30, 90];

  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
        <div class="eyebrow" style="margin-bottom:0;">Ganho x Gasto</div>
      </div>
      <div class="segmented" id="chart-periodo-selector" style="margin-top:10px;">
        ${periodos.map((d) => `<button data-periodo="${d}" class="${state.chartPeriodo === d ? "active" : ""}">${d}d</button>`).join("")}
      </div>
      ${lineChartSVG(data)}
    </div>
    <div class="card">
      <div class="eyebrow">Saldo diário</div>
      ${barChartSVG(data, "saldo")}
    </div>
    <div class="card">
      <div class="eyebrow">Visão mensal (últimos ${dataMensal.length} meses)</div>
      ${barChartSVG(dataMensal, "saldo")}
    </div>
    <div class="card">
      <div class="eyebrow">Eficiência</div>
      <div class="stat-row"><span class="label">${icon("car")} Km rodado lançado</span><span class="value">${fmtKm(totals.km)}</span></div>
      <div class="stat-row"><span class="label">${icon("gauge")} Km total desde a compra</span><span class="value">${fmtKm(kmTotalDesdeCompra)}</span></div>
      <div class="stat-row"><span class="label">${icon("fuel")} R$ ganho por km (Atlas Logística)</span><span class="value">${fmtR(rsPorKm)}</span></div>
      <div class="stat-row"><span class="label">${icon("wrench")} Custo variável por km</span><span class="value">${fmtR(custoPorKm)}</span></div>
      <div class="stat-row"><span class="label">${icon("wrench")} Custo total por km (tudo incluso)</span><span class="value">${fmtR(custoTotalPorKm)}</span></div>
    </div>

    <div class="card">
      <div class="eyebrow">Comparar períodos (lucro Atlas Logística − gasto)</div>
      ${linhaComparacao("Este mês vs mês passado", cmp.mesAtual.lucro, cmp.mesAnterior.lucro)}
      ${linhaComparacao("Últimos 7 dias vs 7 dias anteriores", cmp.semanaAtual.lucro, cmp.semanaAnterior.lucro)}
    </div>

    <div class="card">
      <div class="eyebrow">Melhores dias</div>
      ${rank.melhores.map((d) => `<div class="stat-row"><span class="label">${esc(d.date)}</span><span class="value" style="color:#3FA796;">${fmtR(d.saldo)}</span></div>`).join("") || `<div class="empty">Sem dados suficientes</div>`}
    </div>
    <div class="card">
      <div class="eyebrow">Piores dias</div>
      ${rank.piores.map((d) => `<div class="stat-row"><span class="label">${esc(d.date)}</span><span class="value" style="color:#E85D5D;">${fmtR(d.saldo)}</span></div>`).join("") || `<div class="empty">Sem dados suficientes</div>`}
    </div>

    <div class="card">
      <div class="eyebrow">Quando o carro se paga</div>
      ${
        breakeven.atingido
          ? `<div class="footnote" style="color:#3FA796;font-size:13px;">O carro já se pagou — saldo Atlas Logística x carro acumulado é ${fmtR(breakeven.valor)}.</div>`
          : breakeven.projetavel
          ? `<div class="stat-row"><span class="label">${icon("clock")} No ritmo dos últimos 30 dias</span><span class="value">${breakeven.dataProjetada}</span></div>
             <div class="footnote">Faltam ${breakeven.diasNecessarios} dias, a um ritmo médio de ${fmtR(breakeven.mediaDiaria)}/dia de saldo Atlas Logística x carro.</div>`
          : `<div class="footnote">No ritmo dos últimos 30 dias o carro ainda não se paga — o saldo médio diário está zero ou negativo.</div>`
      }
    </div>
  `;
}

function viewManutencao() {
  const totals = computeTotals(state.entries, state.settings);
  const kmAtual = state.settings.kmInicial + totals.km;
  const lembretes = lembretesStatus(state.lembretes, kmAtual);
  const manut = [...state.manutencoes].sort((a, b) => b.date.localeCompare(a.date));

  const lembretesHtml = lembretes
    .map(
      (l) => `
      <div class="card">

          <div class="hist-actions">
            <span class="mono">${fmtR(m.valor)}</span>

      </div>`
        )
        .join("")

  return `

      <div class="eyebrow">Lembretes por km</div>
      <p class="note">Baseado no km atual do carro: ${fmtKm(kmAtual)}. Isso é só um lembrete visual — não entra na conta de gastos, a não ser que você registre no log abaixo.</p>

// ---------- render + eventos ----------
const VIEWS = {
  inicio: viewInicio,
  lancar: viewLancar,
  historico: viewHistorico,
  manutencao: viewManutencao,
  analise: viewAnalise,
  config: viewConfig,
};

const NAV = [
  { id: "inicio", label: "Início", icon: "home" },
  { id: "lancar", label: "Lançar", icon: "plus" },
  { id: "historico", label: "Histórico", icon: "bar" },
  { id: "manutencao", label: "Manut.", icon: "wrench" },
  { id: "analise", label: "Análise", icon: "trend" },
  { id: "config", label: "Config", icon: "sliders" },
];

function render() {
  const app = document.getElementById("app");
  if (!state.ready) {
    app.innerHTML = `<div class="loading">${icon("car", 22)}&nbsp; Carregando painel…</div>`;
    return;
  }
  app.innerHTML = `
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <div class="logo">${icon("car", 18)}</div>
          <div>
            <div class="title display">Painel do Carro</div>
            <div class="subtitle">Atlas Logística &amp; particular</div>
          </div>
        </div>
        <div class="header-right">
          <span class="saving">${esc(state.savingMsg)}</span>
          <span class="sync-badge" id="sync-badge" title="${state.cloudAvailable ? "Os dados sincronizam automaticamente entre os aparelhos onde você abrir este painel pelo Claude." : "Este painel está rodando fora do Claude, então os dados ficam salvos só neste navegador. Use Exportar/Importar em Config pra levar pra outro aparelho."}">${syncBadgeContent()}</span>
        </div>
      </div>
      <div id="view-container">${VIEWS[state.view]()}</div>
    </div>
    <div class="nav">
      <div class="nav-inner">
        ${NAV.map(
          (n) => `
          <button data-nav="${n.id}" class="${state.view === n.id ? "active" : ""}">
            ${icon(n.icon, 18)}
            <span class="nav-label">${n.label}</span>
          </button>
        `
        ).join("")}
      </div>
    </div>
  `;
  attachEvents();
}

function attachEvents() {
  document.querySelectorAll("[data-nav]").forEach((btn) => {
    btn.addEventListener("click", () => setView(btn.getAttribute("data-nav")));
  });

  if (state.view === "lancar") {
    const btn = document.getElementById("btn-save-entry");
    btn.addEventListener("click", () => {
      const val = (id) => Number(document.getElementById(id).value) || 0;
      const dateVal = document.getElementById("f-date").value || todayISO();
      const dados = {
        date: dateVal,
        km: val("f-km"),
        ganhoAtlas: val("f-ganhoAtlas"),
        ganhoParticular: val("f-ganhoParticular"),
        gastoCombustivel: val("f-gastoCombustivel"),
        gastoOutros: val("f-gastoOutros"),
        horas: val("f-horas"),
      };
      if (state.editingEntryId) {
        const next = state.entries.map((e) => (e.id === state.editingEntryId ? { ...e, ...dados } : e));
        persistEntries(next);
        state.editingEntryId = null;
        setView("historico");
        flashSaved("Lançamento atualizado");
      } else {
        persistEntries([...state.entries, { id: Date.now().toString(), ...dados }]);
        setView("inicio");
        flashSaved("Lançamento salvo");
      }
    });

    const btnCancel = document.getElementById("btn-cancel-edit");
    if (btnCancel) {
      btnCancel.addEventListener("click", () => {
        state.editingEntryId = null;
        setView("historico");
      });
    }

    const btnCopiar = document.getElementById("btn-copiar-ontem");
    if (btnCopiar) {
      btnCopiar.addEventListener("click", () => {
        const ontem = addDaysISO(todayISO(), -1);
        const entryOntem = state.entries.find((e) => e.date === ontem);
        if (!entryOntem) return;
        document.getElementById("f-km").value = entryOntem.km;
        document.getElementById("f-ganhoAtlas").value = entryOntem.ganhoAtlas;
        document.getElementById("f-ganhoParticular").value = entryOntem.ganhoParticular;
        document.getElementById("f-gastoCombustivel").value = entryOntem.gastoCombustivel;
        document.getElementById("f-gastoOutros").value = entryOntem.gastoOutros;
        document.getElementById("f-horas").value = entryOntem.horas;
      });
    }
  }

  if (state.view === "historico") {
    const filtroMes = document.getElementById("f-filtro-mes");
    if (filtroMes) {
      filtroMes.addEventListener("change", () => {
        state.historicoFiltroMes = filtroMes.value;
        render();
      });
    }
    const filtroStatus = document.getElementById("f-filtro-status");
    if (filtroStatus) {
      filtroStatus.addEventListener("change", () => {
        state.historicoFiltroStatus = filtroStatus.value;
        render();
      });
    }
    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del");
        persistEntries(state.entries.filter((e) => e.id !== id));
        render();
      });
    });
    document.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.editingEntryId = btn.getAttribute("data-edit");
        setView("lancar");
      });
    });
  }

  if (state.view === "analise") {
    document.querySelectorAll("#chart-periodo-selector [data-periodo]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.chartPeriodo = Number(btn.getAttribute("data-periodo")) || 14;
        render();
      });
    });
  }

  if (state.view === "manutencao") {
    document.getElementById("btn-add-lembrete").addEventListener("click", () => {
      const tipo = document.getElementById("lb-tipo").value.trim();
      const intervalo = Number(document.getElementById("lb-intervalo").value) || 0;
      const ultimo = Number(document.getElementById("lb-ultimo").value) || 0;
      if (!tipo || intervalo <= 0) return;
      const novo = { id: Date.now().toString(), tipo, intervaloKm: intervalo, ultimoKm: ultimo };
      persistLembretes([...state.lembretes, novo]);
      render();
      flashSaved("Lembrete adicionado");
    });

    document.querySelectorAll("[data-del-lembrete]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del-lembrete");
        persistLembretes(state.lembretes.filter((l) => l.id !== id));
        render();
      });
    });

    document.querySelectorAll("[data-marcar-feito]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-marcar-feito");
        const totals = computeTotals(state.entries, state.settings);
        const kmAtual = state.settings.kmInicial + totals.km;
        const next = state.lembretes.map((l) => (l.id === id ? { ...l, ultimoKm: kmAtual } : l));
        persistLembretes(next);
        render();
        flashSaved("Lembrete atualizado");
      });
    });

    document.getElementById("btn-add-manut").addEventListener("click", () => {
      const tipo = document.getElementById("m-tipo").value.trim();
      const valor = Number(document.getElementById("m-valor").value) || 0;
      if (!tipo) return;
      const novo = {
        id: Date.now().toString(),
        date: document.getElementById("m-date").value || todayISO(),
        tipo,
        oficina: document.getElementById("m-oficina").value.trim(),
        valor,
        km: Number(document.getElementById("m-km").value) || 0,
      };
      persistManutencoes([...state.manutencoes, novo]);
      render();
      flashSaved("Manutenção registrada");
    });

    document.querySelectorAll("[data-del-manut]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del-manut");
        persistManutencoes(state.manutencoes.filter((m) => m.id !== id));
        render();
      });
    });
  }

  if (state.view === "config") {
    const btnToggleNotif = document.getElementById("btn-toggle-notif");
    if (btnToggleNotif) {
      btnToggleNotif.addEventListener("click", async () => {
        if (!state.notifAtivo) {
          const permissao = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
          if (permissao !== "granted") {
            flashSaved(permissao === "denied" ? "Notificações bloqueadas no navegador" : "Permissão não concedida");
            render();
            return;
          }
          state.notifAtivo = true;
          localStorage.setItem("painelAtlas_notif", "1");
          flashSaved("Lembrete ativado");
        } else {
          state.notifAtivo = false;
          localStorage.setItem("painelAtlas_notif", "0");
          flashSaved("Lembrete desativado");
        }
        render();
      });
    }

    document.getElementById("btn-save-settings").addEventListener("click", () => {
      const val = (id) => Number(document.getElementById(id).value) || 0;
      const next = {
        ...state.settings,
        metaDiaria: val("s-metaDiaria"),
        metaHora: val("s-metaHora"),
        metaMensal: val("s-metaMensal"),
      };
      persistSettings(next);
      flashSaved("Metas salvas");
    });

    document.getElementById("btn-save-params").addEventListener("click", () => {
      const val = (id) => Number(document.getElementById(id).value) || 0;
      const date = (id) => document.getElementById(id).value;
      const next = {
        ...state.settings,
        kmInicial: val("s-kmInicial"),
        financDataInicio: date("s-financDataInicio"),
        financEntrada: val("s-financEntrada"),
        financValorParcela: val("s-financValorParcela"),
        financNumParcelas: val("s-financNumParcelas"),
        seguroDataInicio: date("s-seguroDataInicio"),
        seguroValor: val("s-seguroValor"),
        ipvaDataInicio: date("s-ipvaDataInicio"),
        ipvaValorAnual: val("s-ipvaValorAnual"),
      };
      persistSettings(next);
      render();
      flashSaved("Parâmetros salvos");
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const payload = JSON.stringify(
        {
          app: "painel-atlas",
          version: 2,
          exportedAt: new Date().toISOString(),
          settings: state.settings,
          entries: state.entries,
          manutencoes: state.manutencoes,
          lembretes: state.lembretes,
        },
        null,
        2
      );
      baixarArquivo(payload, `painel-atlas-backup-${todayISO()}.json`, "application/json");
    });

    document.getElementById("btn-export-csv").addEventListener("click", () => {
      const header = "data,km,ganhoAtlas,ganhoParticular,gastoCombustivel,gastoOutros,horas";
      const linhas = [...state.entries]
        .sort((a, b) => a.date.localeCompare(b.date))
        .map((e) => [e.date, e.km, e.ganhoAtlas, e.ganhoParticular, e.gastoCombustivel, e.gastoOutros, e.horas].join(","));
      const csv = [header, ...linhas].join("\n");
      baixarArquivo(csv, `painel-atlas-lancamentos-${todayISO()}.csv`, "text/csv;charset=utf-8;");
    });

    const btnExportManutCsv = document.getElementById("btn-export-manut-csv");
    if (btnExportManutCsv) {
      btnExportManutCsv.addEventListener("click", () => {
        const header = "data,tipo,oficina,valor,km";
        const linhas = [...state.manutencoes]
          .sort((a, b) => a.date.localeCompare(b.date))
          .map((m) => [m.date, `"${String(m.tipo).replace(/"/g, '""')}"`, `"${String(m.oficina || "").replace(/"/g, '""')}"`, m.valor, m.km].join(","));
        const csv = [header, ...linhas].join("\n");
        baixarArquivo(csv, `painel-atlas-manutencoes-${todayISO()}.csv`, "text/csv;charset=utf-8;");
      });
    }

    const fileInput = document.getElementById("file-import");
    document.getElementById("btn-import-trigger").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          if (file.name.toLowerCase().endsWith(".csv")) {
            importarCsvEntries(reader.result);
          } else {
            importarJson(reader.result);
          }
        } catch (err) {
          alert("Arquivo inválido. Confira se é um backup exportado por este painel.\n\nDetalhe técnico: " + (err && err.message ? err.message : err));
        }
      };
      reader.readAsText(file);
      fileInput.value = ""; // permite importar o mesmo arquivo de novo, se precisar
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("Isso vai apagar todos os lançamentos e configurações — inclusive da nuvem, se estiver sincronizando. Tem certeza?")) {
        [SKEY, EKEY, MKEY, LKEY].forEach(storageRemove);
        state.settings = { ...defaultSettings };
        state.entries = [];
        state.manutencoes = [];
        state.lembretes = [...DEFAULT_LEMBRETES];
        state.historicoFiltroMes = "todos";
        state.historicoFiltroStatus = "todos";
        state.editingEntryId = null;
        saveEntriesToStorage([]);
        saveManutencoesToStorage([]);
        saveLembretesToStorage(DEFAULT_LEMBRETES);
        setView("inicio");
      }
    });
  }
}

// ---------- import/export: helpers compartilhados ----------
function baixarArquivo(conteudo, nomeArquivo, mime) {
  const blob = new Blob([conteudo], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// importa um backup .json (das versões antiga e nova do painel), validando e
// limpando cada registro antes de gravar, pra nunca deixar dado quebrado entrar.
function importarJson(texto) {
  const parsed = JSON.parse(texto);
  if (!parsed || typeof parsed !== "object") throw new Error("formato inesperado");

  let entradas = 0;
  if (parsed.settings) {
    persistSettings(sanitizeSettings(parsed.settings));
    entradas++;
  }
  if (Array.isArray(parsed.entries)) {
    const limpos = parsed.entries.map(migrateGanho99ToAtlas).map(sanitizeEntry).filter(Boolean);
    persistEntries(limpos);
    entradas++;
  }
  if (Array.isArray(parsed.manutencoes)) {
    persistManutencoes(parsed.manutencoes.map(sanitizeManutencao).filter(Boolean));
    entradas++;
  }
  if (Array.isArray(parsed.lembretes)) {
    persistLembretes(parsed.lembretes.map(sanitizeLembrete).filter(Boolean));
    entradas++;
  }
  if (entradas === 0) throw new Error("nenhum dos 4 modelos (settings/entries/manutencoes/lembretes) foi encontrado no arquivo");
  render();
  flashSaved(`Dados importados (${entradas} modelo${entradas > 1 ? "s" : ""})`);
}

// importa um .csv de lançamentos no mesmo formato exportado por este painel
// (data,km,ganhoAtlas,ganhoParticular,gastoCombustivel,gastoOutros,horas).
// Aceita também o formato antigo com a coluna "ganho99".
function importarCsvEntries(texto) {
  const linhas = texto.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  if (linhas.length < 2) throw new Error("CSV vazio ou sem linhas de dados");
  const colunas = linhas[0].split(",").map((c) => c.trim());
  const idxData = colunas.indexOf("data");
  if (idxData === -1) throw new Error('coluna "data" não encontrada no cabeçalho do CSV');
  const idxGanho = colunas.indexOf("ganhoAtlas") !== -1 ? colunas.indexOf("ganhoAtlas") : colunas.indexOf("ganho99");
  const idxKm = colunas.indexOf("km");
  const idxGanhoParticular = colunas.indexOf("ganhoParticular");
  const idxCombustivel = colunas.indexOf("gastoCombustivel");
  const idxOutros = colunas.indexOf("gastoOutros");
  const idxHoras = colunas.indexOf("horas");

  const novos = [];
  for (let i = 1; i < linhas.length; i++) {
    const campos = linhas[i].split(",");
    const bruto = {
      date: (campos[idxData] || "").trim(),
      km: idxKm !== -1 ? campos[idxKm] : 0,
      ganhoAtlas: idxGanho !== -1 ? campos[idxGanho] : 0,
      ganhoParticular: idxGanhoParticular !== -1 ? campos[idxGanhoParticular] : 0,
      gastoCombustivel: idxCombustivel !== -1 ? campos[idxCombustivel] : 0,
      gastoOutros: idxOutros !== -1 ? campos[idxOutros] : 0,
      horas: idxHoras !== -1 ? campos[idxHoras] : 0,
    };
    const limpo = sanitizeEntry(bruto);
    if (limpo) novos.push(limpo);
  }
  if (!novos.length) throw new Error("nenhuma linha válida encontrada no CSV");

  const substituir = confirm(
    `Encontrei ${novos.length} lançamento(s) válido(s) no CSV.\n\nOK = substituir todos os lançamentos atuais por esses.\nCancelar = mesclar (mantém os lançamentos atuais e adiciona só as datas novas do CSV).`
  );
  let finalEntries;
  if (substituir) {
    finalEntries = novos;
  } else {
    const datasNovas = new Set(novos.map((e) => e.date));
    finalEntries = [...state.entries.filter((e) => !datasNovas.has(e.date)), ...novos];
  }
  persistEntries(finalEntries);
  render();
  flashSaved(`${novos.length} lançamento(s) importado(s) do CSV`);
}

init();

  </script>
</body>
</html>
